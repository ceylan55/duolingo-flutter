name: Build Pipi Talk (APK & Play Store AAB)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.10.5'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK (Direct Install)
        run: flutter build apk --release -v

      - name: Build App Bundle (Google Play Store AAB)
        run: flutter build appbundle --release -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipitalk-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipitalk-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
